name: Manual Release (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip version bump and release'
        type: boolean
        default: false
      build_ios:
        description: 'Build iOS (requires Apple signing certificates)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: 'application'

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && github.run_attempt == 1 }}
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_name: ${{ steps.bump.outputs.version_name }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Run version bump
        id: bump
        run: |
          bash .github/scripts/bump_version.sh
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          PUBSPEC_PATH: ${{ env.APP_DIR }}/pubspec.yaml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.APP_DIR }}/pubspec.yaml"
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build-android:
    needs: bump-version
    if: ${{ always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    uses: ./.github/workflows/build-platform.yml
    with:
      target: 'android'
      os: 'ubuntu-latest'
      build_cmd: 'flutter build apk --release --split-per-abi && flutter build appbundle --release'
      artifact_path: 'build/app/outputs'
    secrets: inherit

  build-ios:
    needs: bump-version
    if: ${{ inputs.build_ios && always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    uses: ./.github/workflows/build-platform.yml
    with:
      target: 'ios'
      os: 'macos-15'
      build_cmd: 'flutter build ipa --release --export-method app-store'
      artifact_path: 'build/ios/ipa'
    secrets: inherit

  generate-checksums:
    name: Generate SHA-256 Checksums
    needs: [build-android, build-ios]
    if: >-
      ${{ always() && !cancelled() && !inputs.dry_run
          && needs.build-android.result == 'success'
          && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all release zips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          find . -type f -name '*.zip' -exec sha256sum {} \; | sed 's|\./||' | sort > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checksums
          path: artifacts/checksums.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - bump-version
      - build-android
      - build-ios
      - generate-checksums
    if: >-
      ${{ always() && !cancelled() && !inputs.dry_run
          && needs.bump-version.result == 'success'
          && needs.build-android.result == 'success'
          && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
          && needs.generate-checksums.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts (zips + checksums)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-assets
          merge-multiple: true

      - name: Inventory
        run: find release-assets -type f -exec ls -lh {} \;

      - name: Collect release files
        id: files
        run: |
          {
            echo 'list<<EOF'
            find release-assets -type f \( -name '*.zip' -o -name 'checksums.txt' \) -print
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "--- collected ---"
          find release-assets -type f \( -name '*.zip' -o -name 'checksums.txt' \) -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v${{ needs.bump-version.outputs.version_name }}-b${{ needs.bump-version.outputs.build_number }}
          name: Release ${{ needs.bump-version.outputs.new_version }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}