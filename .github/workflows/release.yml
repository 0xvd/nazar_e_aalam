name: Manual Release (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip version bump and release'
        type: boolean
        default: false
      build_ios:
        description: 'Build iOS (requires Apple signing certificates)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: 'application'

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry_run && github.run_attempt == 1 }}
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_name: ${{ steps.bump.outputs.version_name }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Run version bump
        id: bump
        run: bash .github/scripts/bump_version.sh
        env:
          PUBSPEC_PATH: ${{ env.APP_DIR }}/pubspec.yaml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.APP_DIR }}/pubspec.yaml"
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build-android:
    needs: bump-version
    if: ${{ always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    uses: ./.github/workflows/build-platform.yml
    with:
      target: 'android'
      os: 'ubuntu-latest'
      build_cmd: |
        flutter build apk --release --target-platform android-arm,android-arm64,android-x64
        mkdir -p "$GITHUB_WORKSPACE/apk-holder"
        cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apk-holder/app-release.apk"
        flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
        cp build/app/outputs/flutter-apk/*.apk "$GITHUB_WORKSPACE/apk-holder/"
        flutter build appbundle --release
        cp build/app/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/apk-holder/"
      artifact_path: 'build/app/outputs'
    secrets: inherit

  build-ios:
    needs: bump-version
    if: ${{ inputs.build_ios && always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    uses: ./.github/workflows/build-platform.yml
    with:
      target: 'ios'
      os: 'macos-15'
      build_cmd: 'flutter build ipa --release --export-method app-store'
      artifact_path: 'build/ios/ipa'
    secrets: inherit

  generate-checksums:
    name: Generate SHA-256 Checksums
    needs: [build-android, build-ios]
    if: >-
      ${{ always() && !cancelled() && !inputs.dry_run
          && needs.build-android.result == 'success'
          && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -exec sha256sum {} \; | sed 's|\./||' | sort > checksums.txt
          cat checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checksums
          path: artifacts/checksums.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - bump-version
      - build-android
      - build-ios
      - generate-checksums
    if: >-
      ${{ always() && !cancelled() && !inputs.dry_run
          && needs.build-android.result == 'success'
          && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
          && needs.generate-checksums.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for version fallback)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            ${{ env.APP_DIR }}
          sparse-checkout-cone-mode: true
          lfs: false
          fetch-depth: 1

      - name: Determine version
        id: ver
        run: |
          VERSION_NAME="${{ needs.bump-version.outputs.version_name }}"
          BUILD_NUMBER="${{ needs.bump-version.outputs.build_number }}"
          NEW_VERSION="${{ needs.bump-version.outputs.new_version }}"

          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            PUBSPEC="${{ env.APP_DIR }}/pubspec.yaml"
            if [ ! -f "$PUBSPEC" ]; then
              echo "::error::pubspec.yaml not found at $PUBSPEC"
              exit 1
            fi
            FULL_VERSION=$(grep '^version:' "$PUBSPEC" | awk '{print $2}')
            VERSION_NAME="${FULL_VERSION%%+*}"
            BUILD_NUMBER="${FULL_VERSION##*+}"
            NEW_VERSION="$FULL_VERSION"
          fi

          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "::error::Could not determine version - refusing to create v-b tag"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: v${VERSION_NAME}-b${BUILD_NUMBER}"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true

      - name: Inventory
        run: find release-assets -type f -exec ls -lh {} \;

      - name: Collect release files
        id: files
        run: |
          {
            echo 'list<<EOF'
            find release-assets -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name 'checksums.txt' \) -print
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          find release-assets -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name 'checksums.txt' \) -print

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}-b${{ steps.ver.outputs.build_number }}
          name: Release ${{ steps.ver.outputs.new_version }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
