name: Build Single Platform

on:
  workflow_call:
    inputs:
      target:        { required: true, type: string }
      os:            { required: true, type: string }
      build_cmd:     { required: true, type: string }
      artifact_path: { required: true, type: string }
    secrets:
      ANDROID_KEYSTORE_BASE64:     { required: false }
      ANDROID_KEYSTORE_PASSWORD:   { required: false }
      ANDROID_KEY_ALIAS:           { required: false }
      ANDROID_KEY_PASSWORD:        { required: false }

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: 'application'

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # ── FIX: Free disk space before the NDK and CMake are downloaded ──
      - name: Free disk space (Android)
        if: inputs.target == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          df -h

      - name: Set up Java 17 (Android)
        if: inputs.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'                # ← built-in Gradle cache

      # ── FIX: Explicit Gradle cache (belt-and-braces) ──
      - name: Cache Gradle
        if: inputs.target == 'android'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('application/**/*.gradle*', 'application/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux build deps
        if: inputs.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: flutter pub get
        run: flutter pub get

      # ── FIX: Clean any stale transforms directory before building ──
      - name: Clean stale Gradle transforms
        if: inputs.target == 'android'
        run: rm -rf ~/.gradle/caches/*/transforms

      - name: Install CocoaPods deps (iOS)
        if: inputs.target == 'ios'
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Configure Android signing
        if: inputs.target == 'android'
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No Android keystore secrets set — release will be UNSIGNED."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ${{ inputs.build_cmd }}

      - name: Zip Android artifacts
        if: inputs.target == 'android'
        run: |
          cd build/app/outputs
          zip -r "$GITHUB_WORKSPACE/android-build.zip" .

      - name: Zip iOS artifacts
        if: inputs.target == 'ios'
        run: |
          cd build/ios
          zip -r "$GITHUB_WORKSPACE/ios-appstore.zip" ipa

      - name: Upload Android artifact
        if: inputs.target == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: android-build
          path: ${{ github.workspace }}/android-build.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS artifact
        if: inputs.target == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: ios-build
          path: ${{ github.workspace }}/ios-appstore.zip
          if-no-files-found: error
          retention-days: 14