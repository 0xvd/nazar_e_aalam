name: Build Single Platform
on:
  workflow_call:
    inputs:
      target:        { required: true, type: string }
      os:            { required: true, type: string }
      build_cmd:     { required: true, type: string }
      artifact_path: { required: true, type: string }
    secrets:
      ANDROID_KEYSTORE_BASE64:     { required: false }
      ANDROID_KEYSTORE_PASSWORD:   { required: false }
      ANDROID_KEY_ALIAS:           { required: false }
      ANDROID_KEY_PASSWORD:        { required: false }

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: 'application'

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Debug secrets presence
        if: inputs.target == 'android'
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret is set (length: ${#ANDROID_KEYSTORE_BASE64})"
          else
            echo "::error::Keystore secret is NOT set"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Free disk space (Android)
        if: inputs.target == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          df -h

      - name: Set up Java 17 (Android)
        if: inputs.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        if: inputs.target == 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('application/**/*.gradle*', 'application/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ── Replace the original apt-get update + install ──
      - name: Install Linux build deps (cached)
        if: inputs.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          version: 1.0

      - name: flutter pub get
        run: flutter pub get

      # ── Remove the step that clears Gradle transforms ──
      # - name: Clean stale Gradle transforms
      #   if: inputs.target == 'android'
      #   run: rm -rf ~/.gradle/caches/*/transforms

      # ── Add CocoaPods cache + optimize pod install ──
      - name: Cache CocoaPods
        if: inputs.target == 'ios'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('application/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods deps (iOS)
        if: inputs.target == 'ios'
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install   # Remove --repo-update; when cache hits, this will be very fast

      - name: Configure Android signing
        if: inputs.target == 'android'
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No Android keystore secrets set — release will be UNSIGNED."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ${{ inputs.build_cmd }}

      - name: Zip Android artifacts
        if: inputs.target == 'android'
        run: |
          cd build/app/outputs
          zip -r "$GITHUB_WORKSPACE/android-build.zip" .

      - name: Zip iOS artifacts
        if: inputs.target == 'ios'
        run: |
          cd build/ios
          zip -r "$GITHUB_WORKSPACE/ios-appstore.zip" ipa

      - name: Upload Android artifact
        if: inputs.target == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: android-build
          path: ${{ github.workspace }}/android-build.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS artifact
        if: inputs.target == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: ios-build
          path: ${{ github.workspace }}/ios-appstore.zip
          if-no-files-found: error
          retention-days: 14