name: Build Single Platform

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: true
        type: string
      build_cmd:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      IOS_CERT_BASE64:
        required: false
      IOS_CERT_PASSWORD:
        required: false
      IOS_PROFILE_BASE64:
        required: false

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: 'application'
  APP_NAME: 'nazar-e-aalam'

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Verify Android secrets
        if: inputs.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Android keystore secret is set (length: ${#ANDROID_KEYSTORE_BASE64})"
          else
            echo "::error::Android keystore secret is NOT set"
            exit 1
          fi

      - name: Verify iOS secrets
        if: inputs.target == 'ios'
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "${IOS_CERT_BASE64:-}" ] || [ -z "${IOS_CERT_PASSWORD:-}" ] || [ -z "${IOS_PROFILE_BASE64:-}" ]; then
            echo "::error::iOS signing secrets are not set"
            exit 1
          fi

      - name: Free disk space
        if: inputs.target == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          df -h

      - name: Set up Java
        if: inputs.target == 'android'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        if: inputs.target == 'android'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('application/**/*.gradle*', 'application/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux build deps
        if: inputs.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          version: 1.0

      - name: flutter pub get
        run: flutter pub get

      - name: Cache CocoaPods
        if: inputs.target == 'ios'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('application/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods deps
        if: inputs.target == 'ios'
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install

      - name: Install iOS signing
        if: inputs.target == 'ios'
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          security find-identity -v -p codesigning

      - name: Configure Android signing
        if: inputs.target == 'android'
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ${{ inputs.build_cmd }}

      - name: Stage Android assets
        if: inputs.target == 'android'
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/release-assets"
          HOLDER="$GITHUB_WORKSPACE/apk-holder"
          mkdir -p "$OUT_DIR"

          if [ ! -d "$HOLDER" ]; then
            echo "::error::apk-holder not found at $HOLDER - build_cmd did not create it"
            exit 1
          fi
          if [ -z "$(ls -A "$HOLDER" 2>/dev/null)" ]; then
            echo "::error::apk-holder is empty - no APKs/AABs were copied"
            exit 1
          fi

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          APP_NAME="${{ env.APP_NAME }}"

          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi

          for apk in "$HOLDER"/*.apk; do
            [ -e "$apk" ] || continue
            base=$(basename "$apk" .apk)
            if [ "$base" = "app-release" ]; then
              cp "$apk" "$OUT_DIR/${APP_NAME}-universal-release-v${VERSION}.apk"
            else
              abi=$(echo "$base" | sed 's/^app-//; s/-release$//')
              cp "$apk" "$OUT_DIR/${APP_NAME}-${abi}-release-v${VERSION}.apk"
            fi
          done

          for aab in "$HOLDER"/*.aab; do
            [ -e "$aab" ] || continue
            cp "$aab" "$OUT_DIR/${APP_NAME}-release-v${VERSION}.aab"
          done

          ls -lh "$OUT_DIR"

      - name: Stage iOS assets
        if: inputs.target == 'ios'
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$OUT_DIR"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          APP_NAME="${{ env.APP_NAME }}"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi
          for ipa in build/ios/ipa/*.ipa; do
            [ -e "$ipa" ] || continue
            cp "$ipa" "$OUT_DIR/${APP_NAME}-ios-appstore-v${VERSION}.ipa"
          done

          ls -lh "$OUT_DIR"

      - name: Upload Android assets
        if: inputs.target == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-assets
          path: ${{ github.workspace }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS assets
        if: inputs.target == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-assets
          path: ${{ github.workspace }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
