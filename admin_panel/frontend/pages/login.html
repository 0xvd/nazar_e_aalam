<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in · Nazar-e-Aalam Admin</title>
  <meta name="description" content="Sign in to the Nazar-e-Aalam admin panel.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/login.css">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>
<body>
  <div class="bgfx"><div class="au a1"></div><div class="au a2"></div></div>
  <section id="login">
    <div class="lbrand">
    <img class="logo-big" src="../assets/img/logo.png" alt="Nazar-e-Aalam">
      <!-- <svg class="logo-big" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Nazar-e-Aalam"><path d="M15.5 3.2a9 9 0 1 0 5.3 11.9A7.2 7.2 0 0 1 15.5 3.2z"/><path d="M18.5 4l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg> -->
      <div class="ar">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <h1>Nazar-e-Aalam</h1>
      <p>Manage your Islamic app content, prayer times and settings in one place.</p>
    </div>
    <div class="lform">
      <form class="glass lc" id="lf" novalidate>
        <h2>Welcome back</h2>
        <p class="sub">Sign in to continue to your admin panel</p>
        <label for="em">Email</label>
        <div class="fld">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
          <input id="em" type="email" placeholder="admin@nazareaalam.com" autocomplete="username" required>
        </div>
        <label for="pw">Password</label>
        <div class="fld">
          <svg class="i" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye" id="eye" aria-label="Show or hide password" title="Show or hide password">
            <svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn" type="submit"><span class="bt">Sign in</span><span class="sp2"></span></button>
        <p class="sub note">Demo: any email + password (6+ characters)</p>
      </form>
    </div>
  </section>
  <script src="../assets/js/login.js"></script>
</body>
</html>
