<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nazar-e-Aalam Admin</title>
    <meta
      name="description"
      content="Nazar-e-Aalam admin panel for Islamic content, prayer times and app settings."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbd9b5" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <!-- Send signed-out visitors to the login page before anything renders -->
    <script>
      try {
        if (!sessionStorage.getItem("u")) location.replace("login/login.html");
      } catch (e) {
        location.replace("login/login.html");
      }
    </script>
  </head>
  <body>
    <div class="bgfx" aria-hidden="true">
      <div class="au a1"></div>
      <div class="au a2"></div>
    </div>
    <div class="scrim" data-act="menu" aria-hidden="true"></div>

    <div id="app">
      <aside class="glass" id="side">
        <div class="brand">
          <img
            id="brandImg"
            src="assets/img/logo.png"
            alt="Nazar-e-Aalam logo"
          />
          <div>
            <b id="brandName">Nazar-e-Aalam</b
            ><span id="brandSub">Admin panel</span>
          </div>
        </div>
        <nav id="nav" aria-label="Main"></nav>
      </aside>

      <main>
        <header class="glass">
          <button
            class="chip glass menu"
            aria-label="Toggle navigation"
            aria-controls="side"
            aria-expanded="false"
            title="Toggle navigation"
            data-act="menu"
          >
            <svg class="i" viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <h3 id="pt">Dashboard</h3>
          <div class="sp"></div>
          <button
            class="chip glass"
            aria-label="Switch language"
            title="Switch language"
            data-act="lang"
          >
            <svg class="i" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
            </svg>
            <span id="lg">العربية</span>
          </button>
          <div class="av glass">
            <em id="ini">A</em><small id="un">admin</small>
          </div>
          <button
            class="chip glass"
            aria-label="Sign out"
            title="Sign out"
            data-act="logout"
          >
            <svg class="i" viewBox="0 0 24 24">
              <path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9" />
            </svg>
          </button>
        </header>
        <div class="page" id="page" tabindex="-1"></div>
      </main>
    </div>

    <div id="modal" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript
      ><p style="padding: 24px; font-family: sans-serif">
        This admin panel needs JavaScript enabled.
      </p></noscript
    >
    <script src="assets/js/app.js"></script>
  </body>
</html>
